name: Test

# Keyless self-tests against the fixture project in test/fixture — plan mode
# and check need no provider or server credentials. The CLI version is pinned
# to a release that reads the fixture's `collections:` recipe (1.2.0-rc17 or
# later); bump deliberately.
#
# The check-outcome and reporting jobs put stubs (test/stub) on PATH instead:
# a kapi that exits with a chosen code, and a gh that records the sticky PR
# comment rather than posting it. Every exit code kapi check can end with, and
# each did-not-run cause, is exercised whatever the pinned release can produce.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

env:
  KAPI_VERSION: "1.2.0-rc32"

jobs:
  test-plan:
    name: "up --plan (dry run + outputs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: neokapi/setup-kapi@v1
        with:
          version: ${{ env.KAPI_VERSION }}
          plugins: ""

      - name: Run plan
        id: plan
        uses: ./
        with:
          plan: "true"
          project: "test/fixture/kapi.yaml"

      - name: Verify plan outputs
        env:
          MISSING: ${{ steps.plan.outputs.plan-missing }}
          TOKENS: ${{ steps.plan.outputs.plan-token-estimate }}
        run: |
          echo "plan: missing=${MISSING} tokens=${TOKENS}"
          test "${MISSING}" -gt 0
          test "${TOKENS}" -gt 0

  test-check-gate:
    name: "check --ship (exit-3 contract)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: neokapi/setup-kapi@v1
        with:
          version: ${{ env.KAPI_VERSION }}
          plugins: ""

      # The fixture is deliberately untranslated: the ship gate must FAIL the
      # step (exit 3) while still publishing gate=fail — not die before its
      # outputs, and not pass.
      - name: Run failing ship gate
        id: gate
        continue-on-error: true
        uses: ./
        with:
          command: check
          args: "--ship"
          project: "test/fixture/kapi.yaml"

      - name: Verify gate contract
        env:
          STEP_OUTCOME: ${{ steps.gate.outcome }}
          GATE: ${{ steps.gate.outputs.gate }}
          RESULT: ${{ steps.gate.outputs.result }}
          STATUS: ${{ steps.gate.outputs.status }}
        run: |
          echo "step outcome: ${STEP_OUTCOME}, gate: ${GATE}, result: ${RESULT}, status: ${STATUS}"
          test "${STEP_OUTCOME}" = "failure"
          test "${GATE}" = "fail"
          test "${RESULT}" = "failed"
          test "${STATUS}" = "failed"

  test-check-file:
    name: "check <files> (file-mode pass)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: neokapi/setup-kapi@v1
        with:
          version: ${{ env.KAPI_VERSION }}
          plugins: ""

      - name: Gate the fixture source file
        id: check
        uses: ./
        with:
          command: check
          args: "test/fixture/content/en.json"

      - name: Verify pass
        env:
          GATE: ${{ steps.check.outputs.gate }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          test "${GATE}" = "pass"
          test "${RESULT}" = "passed"

  test-check-outcomes:
    name: "check outcomes through the action (kapi stub)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Put the kapi stub on PATH
        run: echo "${GITHUB_WORKSPACE}/test/stub" >> "$GITHUB_PATH"

      # One run of the action per outcome. Every run but the first fails its
      # step on purpose; the last step reads each one's outcome and outputs.
      - name: "exit 0: passed"
        id: passed
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/passed.txt
          KAPI_STUB_EXIT: "0"
        with:
          command: check

      - name: "exit 3: failed"
        id: failed
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/failed.txt
          KAPI_STUB_EXIT: "3"
        with:
          command: check
          args: "--ship"

      - name: "exit 4: checker_invalid"
        id: checker_invalid
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/checker_invalid.txt
          KAPI_STUB_EXIT: "4"
        with:
          command: check

      - name: "exit 4: checker_invalid (JSON)"
        id: checker_invalid_json
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/checker_invalid.json
          KAPI_STUB_EXIT: "4"
        with:
          command: check
          args: "--json"

      - name: "exit 4: nothing_to_check"
        id: nothing_to_check
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/nothing_to_check.txt
          KAPI_STUB_EXIT: "4"
        with:
          command: check

      - name: "exit 4: content_not_checked"
        id: content_not_checked
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/content_not_checked.ship.txt
          KAPI_STUB_EXIT: "4"
        with:
          command: check
          args: "--ship --gate voice"

      - name: "exit 4: no cause in the output"
        id: unknown
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_EXIT: "4"
        with:
          command: check

      - name: "exit 1: operational error"
        id: error
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_EXIT: "1"
        with:
          command: check

      - name: Verify each outcome and its outputs
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          status=0
          # expect STEP OUTCOME RESULT GATE CAUSE
          expect() {
            local got want
            got="$(jq -r --arg id "$1" '.[$id] | [.outcome, (.outputs.result // ""), (.outputs.gate // ""), (.outputs["did-not-run-cause"] // "")] | join(" | ")' <<< "$STEPS")"
            want="$2 | $3 | $4 | $5"
            if [ "$got" = "$want" ]; then
              echo "ok   $1: $got"
            else
              echo "::error::$1: got '$got', want '$want'"
              status=1
            fi
          }
          expect passed               success passed      pass ""
          expect failed               failure failed      fail ""
          expect checker_invalid      failure did_not_run ""   checker_invalid
          expect checker_invalid_json failure did_not_run ""   checker_invalid
          expect nothing_to_check     failure did_not_run ""   nothing_to_check
          expect content_not_checked  failure did_not_run ""   content_not_checked
          expect unknown              failure did_not_run ""   unknown
          expect error                failure error       ""   ""
          exit "$status"

  test-check-reporting:
    name: "reporting after a failing check (kapi and gh stubs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Put the stubs on PATH
        run: echo "${GITHUB_WORKSPACE}/test/stub" >> "$GITHUB_PATH"

      # Each run asks for the sticky PR comment, and the gh stub records the
      # body instead of posting it. The action comments only on pull_request
      # events, so on a push or a schedule the verify step expects no comment.
      - name: "exit 0 with pr-comment"
        id: passed
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/passed.txt
          KAPI_STUB_EXIT: "0"
          GH_STUB_LOG: ${{ runner.temp }}/gh-passed
        with:
          command: check
          pr-comment: "true"

      - name: "exit 3 with pr-comment"
        id: failed
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/failed.txt
          KAPI_STUB_EXIT: "3"
          GH_STUB_LOG: ${{ runner.temp }}/gh-failed
        with:
          command: check
          args: "--ship"
          pr-comment: "true"

      - name: "exit 4 with pr-comment"
        id: did_not_run
        continue-on-error: true
        uses: ./
        env:
          KAPI_STUB_OUTPUT: test/check-output/checker_invalid.txt
          KAPI_STUB_EXIT: "4"
          GH_STUB_LOG: ${{ runner.temp }}/gh-did_not_run
        with:
          command: check
          pr-comment: "true"

      - name: Verify the reports, and that the check still failed
        env:
          STEPS: ${{ toJSON(steps) }}
          EVENT_NAME: ${{ github.event_name }}
          GH_LOGS: ${{ runner.temp }}
        run: |
          status=0
          expect() {
            if [ "$2" = "$3" ]; then
              echo "ok   $1: $2"
            else
              echo "::error::$1: got '$2', want '$3'"
              status=1
            fi
          }
          # value STEP FILTER reads one field of a step from the steps context.
          value() {
            jq -r --arg id "$1" ".[\$id] | $2 // \"\"" <<< "$STEPS"
          }
          # comment STEP TEXT: on a pull_request event the body the action
          # posted must contain TEXT; on any other event it must post nothing.
          comment() {
            local body="${GH_LOGS}/gh-$1/body.md"
            if [ "$EVENT_NAME" != "pull_request" ]; then
              if [ -e "$body" ]; then
                echo "::error::$1: a comment was posted on a ${EVENT_NAME} event"
                status=1
              else
                echo "ok   $1: no comment on a ${EVENT_NAME} event"
              fi
            elif [ ! -f "$body" ]; then
              echo "::error::$1: no comment was posted"
              status=1
            elif grep -qF -- "$2" "$body"; then
              echo "ok   $1: the comment contains: $2"
            else
              echo "::error::$1: the comment lacks: $2"
              sed 's/^/     > /' "$body"
              status=1
            fi
          }

          # The action step itself fails on exit 3 and exit 4, which is what
          # fails a job that does not set continue-on-error.
          expect "passed outcome" "$(value passed .outcome)" success
          expect "failed outcome" "$(value failed .outcome)" failure
          expect "did_not_run outcome" "$(value did_not_run .outcome)" failure

          # The reporting steps still ran after the failing check.
          expect "passed status" "$(value passed .outputs.status)" no-changes
          expect "failed status" "$(value failed .outputs.status)" failed
          expect "did_not_run status" "$(value did_not_run .outputs.status)" failed
          expect "passed has-changes" "$(value passed '.outputs["has-changes"]')" false
          expect "failed has-changes" "$(value failed '.outputs["has-changes"]')" false
          expect "did_not_run has-changes" "$(value did_not_run '.outputs["has-changes"]')" false
          expect "did_not_run did-not-run-cause" "$(value did_not_run '.outputs["did-not-run-cause"]')" checker_invalid

          comment passed "✅ **Gate: pass**"
          comment failed "❌ **Gate: unmet**"
          comment did_not_run "❌ **Did not run** (\`checker_invalid\`): a checker failed its canary, so this run's result cannot be trusted."
          exit "$status"

  test-check-annotations:
    name: "check outcomes: exit codes, outputs and annotations (kapi stub)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Runs the action's own step scripts once per outcome, including the
      # did-not-run causes read from text, JSON, YAML and colored output, and
      # the sticky PR comment each outcome renders.
      - name: Run the check-outcome harness
        run: |
          yq --version
          test/check-outcomes.sh

  test-run-keyless:
    name: "pseudo-translate (general runner)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: neokapi/setup-kapi@v1
        with:
          version: ${{ env.KAPI_VERSION }}
          plugins: ""

      - name: Pseudo-translate the fixture
        id: pseudo
        uses: ./
        with:
          command: pseudo-translate
          args: "test/fixture/content/en.json --target-lang qps"

      # The produced en_qps.json is gitignored by the fixture, so the action
      # must report no-changes with nothing for a delivery step.
      - name: Verify no-changes path
        env:
          STATUS: ${{ steps.pseudo.outputs.status }}
        run: |
          test -f test/fixture/content/en_qps.json
          test "${STATUS}" = "no-changes"

  # The README sends callers to setup-kapi's cache-tm for caching rather than a
  # cache step of their own. The save job runs the action and finds kapi's parse
  # cache where setup-kapi saves it, and nothing at the retired .kapi/cache path;
  # the restore job must find that cache in place before the action runs again.
  test-parse-cache-save:
    name: "parse cache: written where setup-kapi saves it"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: neokapi/setup-kapi@v1
        with:
          version: ${{ env.KAPI_VERSION }}
          plugins: ""
          project-dir: test/fixture

      - name: Report status
        uses: ./
        with:
          command: status
          project: "test/fixture/kapi.yaml"

      - name: Verify the cache paths
        run: |
          test -f test/fixture/.kapi/work/cache/docs/index.db
          test ! -e test/fixture/.kapi/cache

  test-parse-cache-restore:
    name: "parse cache: restored before the action runs"
    needs: test-parse-cache-save
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: neokapi/setup-kapi@v1
        with:
          version: ${{ env.KAPI_VERSION }}
          plugins: ""
          project-dir: test/fixture

      - name: Verify the restored cache
        run: test -f test/fixture/.kapi/work/cache/docs/index.db

      - name: Report status on the restored cache
        id: status
        uses: ./
        with:
          command: status
          project: "test/fixture/kapi.yaml"

      - name: Verify the action reports no changes
        env:
          STATUS: ${{ steps.status.outputs.status }}
        run: test "${STATUS}" = "no-changes"
