name: "Kapi Run"
description: "Run kapi commands — catch up translations, gate content quality, plan cost — and report what changed. Delivery (commit, push, PR) is your workflow's own step"
branding:
  icon: "refresh-cw"
  color: "blue"

inputs:
  command:
    description: "Kapi subcommand to execute"
    required: false
    default: "up"
  args:
    description: "Additional arguments"
    required: false
    default: ""
  project:
    description: "Path to the kapi.yaml recipe (-p flag)"
    required: false
    default: ""
  plan:
    description: >-
      With `command: up`, dry-run instead: report pending work, TM leverage,
      and a token estimate without writing anything or calling a provider.
      Pairs with `pr-comment` to post the cost of a change on its PR.
    required: false
    default: "false"
  fail-on-parked:
    description: >-
      With `command: up`, fail the workflow when the run parks (work remains that
      the loop could not carry to the ship gate). Parked is normal pending work,
      not a broken run, so the default is to report what it caught up and
      annotate the rest.
    required: false
    default: "false"
  pr-comment:
    description: >-
      On pull-request events, post one sticky comment with the report (plan,
      `kapi up` outcome, or check result, including a failed gate or a check
      that did not run) that re-runs update in place.
      Needs `permissions: pull-requests: write`.
    required: false
    default: "false"
  token:
    description: "GitHub token for the sticky PR comment"
    required: false
    default: ${{ github.token }}
  paths:
    description: "Space-separated paths to scan for changes (empty = whole working tree)"
    required: false
    default: ""

outputs:
  status:
    description: "Run result: success, no-changes, or failed (with `command: check`: a failed gate or a check that did not run)"
    value: ${{ steps.set-outputs.outputs.status }}
  outcome:
    description: "With `command: up`: `converged` or `parked` (empty for other commands)"
    value: ${{ steps.run-kapi.outputs.outcome }}
  passes:
    description: "With `command: up`: how many reconciliation passes the run took"
    value: ${{ steps.run-kapi.outputs.passes }}
  parked-locales:
    description: "With `command: up`: comma-separated locales still short of their gate"
    value: ${{ steps.run-kapi.outputs.parked-locales }}
  gate:
    description: "With `command: check`: `pass` or `fail` (empty when the check did not run or errored)"
    value: ${{ steps.run-kapi.outputs.gate }}
  result:
    description: "With `command: check`: `passed`, `failed`, `did_not_run`, or `error`"
    value: ${{ steps.run-kapi.outputs.result }}
  did-not-run-cause:
    description: >-
      With `command: check`, when `result` is `did_not_run`: `checker_invalid`
      (a checker failed its canary, so the result cannot be trusted),
      `nothing_to_check`, `content_not_checked`, or `unknown` when kapi's
      output named no cause
    value: ${{ steps.run-kapi.outputs.did-not-run-cause }}
  plan-missing:
    description: "With `plan: true`: pending units across all locales"
    value: ${{ steps.run-kapi.outputs.plan-missing }}
  plan-tm-exact:
    description: "With `plan: true`: units recoverable from TM exact hits"
    value: ${{ steps.run-kapi.outputs.plan-tm-exact }}
  plan-ai-remaining:
    description: "With `plan: true`: units left for AI translation"
    value: ${{ steps.run-kapi.outputs.plan-ai-remaining }}
  plan-token-estimate:
    description: "With `plan: true`: estimated tokens for the remaining units"
    value: ${{ steps.run-kapi.outputs.plan-token-estimate }}
  has-changes:
    description: "Whether the run left changes in the working tree for your delivery step"
    value: ${{ steps.check-changes.outputs.has_changes }}
  changed-files:
    description: "Newline-separated paths the run changed (git status --porcelain paths)"
    value: ${{ steps.check-changes.outputs.changed_files }}

runs:
  using: "composite"
  steps:
    - name: Run kapi
      id: run-kapi
      shell: bash
      # Inputs cross into the step as env vars (data), never interpolated into
      # the script source — so shell metacharacters in an input can't execute.
      # The command is built as an argv array and exec'd directly (no eval).
      env:
        COMMAND: ${{ inputs.command }}
        ARGS: ${{ inputs.args }}
        PROJECT: ${{ inputs.project }}
        PLAN: ${{ inputs.plan }}
        FAIL_ON_PARKED: ${{ inputs.fail-on-parked }}
      run: |
        set -euo pipefail
        cmd=(kapi "$COMMAND")
        [ -n "$PROJECT" ] && cmd+=(-p "$PROJECT")
        # args is a free-form fragment: split on whitespace into argv (no eval,
        # no globbing of the string as source).
        if [ -n "$ARGS" ]; then
          read -ra extra <<< "$ARGS"
          cmd+=("${extra[@]}")
        fi

        # ---------- plan mode: dry run, no writes, no provider calls ----------
        if [ "$COMMAND" = "up" ] && [ "$PLAN" = "true" ]; then
          cmd+=(--plan --json)
          printf 'Running:'; printf ' %q' "${cmd[@]}"; echo
          "${cmd[@]}" > "${RUNNER_TEMP}/kapi-plan.json"
          MISSING=$(jq -r '.totals.missingTarget // 0' "${RUNNER_TEMP}/kapi-plan.json")
          TM=$(jq -r '.totals.tmExact // 0' "${RUNNER_TEMP}/kapi-plan.json")
          AI=$(jq -r '.totals.aiRemaining // 0' "${RUNNER_TEMP}/kapi-plan.json")
          TOKENS=$(jq -r '.totals.tokenEstimate // 0' "${RUNNER_TEMP}/kapi-plan.json")
          {
            echo "mode=plan"
            echo "plan-missing=${MISSING}"
            echo "plan-tm-exact=${TM}"
            echo "plan-ai-remaining=${AI}"
            echo "plan-token-estimate=${TOKENS}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## kapi up — plan"
            echo
            echo "This change leaves **${MISSING} unit(s)** of pending translation work: ${TM} recoverable from TM, ${AI} for AI (~${TOKENS} tokens estimated)."
            echo
            echo "| Locale | Pending | TM exact | AI remaining | Token estimate |"
            echo "|---|---|---|---|---|"
            jq -r '.scopes[] | "| \(.locale) | \(.missingTarget) | \(.tmExact) | \(.aiRemaining) | \(.tokenEstimate) |"' "${RUNNER_TEMP}/kapi-plan.json"
            echo
            echo "_Estimate is source-chars/4; no provider calls were made._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Plan: ${MISSING} unit(s) pending, ${TM} from TM, ${AI} for AI (~${TOKENS} tokens)."
          exit 0
        fi

        # ---------- check: the quality gate, with distinct exit-3 and exit-4 signals ----------
        if [ "$COMMAND" = "check" ]; then
          printf 'Running:'; printf ' %q' "${cmd[@]}"; echo
          # || rc=$? keeps the check's exit code without tripping errexit, so the
          # annotation, summary, and outputs still publish when it fails.
          CHECK_OUTPUT="${RUNNER_TEMP}/kapi-check-output.txt"
          rc=0
          "${cmd[@]}" | tee "$CHECK_OUTPUT" || rc=$?
          if [ "$rc" -eq 0 ]; then
            {
              echo "gate=pass"
              echo "result=passed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## kapi check"
              echo
              echo "✅ **Gate: pass**"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 3 ]; then
            {
              echo "gate=fail"
              echo "result=failed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## kapi check"
              echo
              echo "❌ **Gate: unmet** — a brand, terminology, QA, or coverage gate failed. See the findings in the job log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kapi gate unmet (exit 3) — content quality gates failed; read the findings and fix them. This is 'not on-spec yet', not a crash."
            exit 3
          elif [ "$rc" -eq 4 ]; then
            # Exit 4: the check did not run, so it reached no verdict. kapi names
            # the cause in the report it printed: `did_not_run_cause` in JSON or
            # YAML, and a text sentence ending in "(<cause>)". The command line
            # is the caller's, so read whichever format it produced, with color
            # codes removed. Older kapi releases never exit 4.
            PLAIN_OUTPUT="${RUNNER_TEMP}/kapi-check-output.plain.txt"
            esc="$(printf '\033')"
            sed "s/${esc}\[[0-9;]*m//g" "$CHECK_OUTPUT" > "$PLAIN_OUTPUT"
            CAUSE=""
            if jq -e 'type == "object"' "$PLAIN_OUTPUT" > /dev/null 2>&1; then
              CAUSE="$(jq -r '.did_not_run_cause // empty | strings' "$PLAIN_OUTPUT")"
            fi
            if [ -z "$CAUSE" ]; then
              CAUSE="$(sed -n -E \
                -e 's/^did_not_run_cause:[[:space:]]*"?([a-z_]+)"?[[:space:]]*$/\1/p' \
                -e 's/.*Did not run: .*\(([a-z_]+)\)[[:space:]]*$/\1/p' \
                "$PLAIN_OUTPUT" | tail -n 1)"
            fi
            case "$CAUSE" in
              "" | *[!a-z_]*) CAUSE="unknown" ;;
            esac
            case "$CAUSE" in
              checker_invalid)
                SUMMARY="a checker failed its canary, so this run's result cannot be trusted"
                ADVICE="Read it as neither a pass nor a gate failure: fix or report the checker the log names, then re-run."
                ;;
              nothing_to_check)
                SUMMARY="there was nothing in scope to check"
                ADVICE="No content reached the check. Confirm the recipe's content paths or the files passed in args."
                ;;
              content_not_checked)
                SUMMARY="content in scope was not checked"
                ADVICE="A requested gate or analyzer had nothing bound, or a changed file could not be checked. The log names which."
                ;;
              unknown)
                SUMMARY="kapi's output named no cause"
                ADVICE="Read the job log for the reason."
                ;;
              *)
                SUMMARY="kapi gave a cause this version of the action does not describe"
                ADVICE="Read the job log for the reason."
                ;;
            esac
            {
              echo "result=did_not_run"
              echo "did-not-run-cause=${CAUSE}"
              echo "did-not-run-summary=${SUMMARY}. ${ADVICE}"
            } >> "$GITHUB_OUTPUT"
            ICON="⚠️"
            if [ "$CAUSE" = "checker_invalid" ]; then
              ICON="❌"
            fi
            {
              echo "## kapi check"
              echo
              echo "${ICON} **Did not run** (\`${CAUSE}\`): ${SUMMARY}. ${ADVICE}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kapi check did not run (exit 4, ${CAUSE}): ${SUMMARY}. ${ADVICE}"
            exit 4
          else
            {
              echo "run_status=failed"
              echo "result=error"
            } >> "$GITHUB_OUTPUT"
            echo "::error::kapi check failed operationally (exit ${rc})"
            exit "$rc"
          fi
          exit 0
        fi

        # `kapi up` runs the kapi loop: in a server-connected project it
        # pushes, catches up on the Bowrain server, and pulls the produced targets
        # back; with no server it runs the same loop locally. Under --json it is
        # an NDJSON stream — one convergence event per line, closed by a single
        # {"type":"result", ...} record. That record is the CI contract; the
        # events are the log.
        STREAM=""
        if [ "$COMMAND" = "up" ]; then
          case " ${ARGS} " in
            *" --json "*) ;;               # the caller already asked for it
            *) cmd+=(--json) ;;
          esac
          STREAM="${RUNNER_TEMP}/kapi-up.ndjson"
        fi

        printf 'Running:'; printf ' %q' "${cmd[@]}"; echo

        # A failed or canceled run exits non-zero: this step fails, and
        # has-changes never reports — a broken run must never hand a delivery
        # step partial work as if it were a finished one.
        if [ -n "$STREAM" ]; then
          if ! "${cmd[@]}" | tee "$STREAM"; then
            echo "run_status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::kapi ${COMMAND} failed"
            exit 1
          fi
        else
          if ! "${cmd[@]}"; then
            echo "run_status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::kapi ${COMMAND} failed"
            exit 1
          fi
        fi
        echo "run_status=success" >> "$GITHUB_OUTPUT"

        [ -n "$STREAM" ] || exit 0

        RESULT="$(jq -c 'select(.type == "result")' "$STREAM" | tail -n 1)"
        if [ -z "$RESULT" ]; then
          echo "::error::kapi up produced no result record — the run did not complete"
          exit 1
        fi

        CONVERGED="$(jq -r '.converged // false' <<< "$RESULT")"
        PASSES="$(jq -r '.passes // 0' <<< "$RESULT")"
        PARKED="$(jq -r '[.parkedScopes[]?.locale] | unique | join(",")' <<< "$RESULT")"

        if [ "$CONVERGED" = "true" ]; then
          OUTCOME="converged"
        else
          OUTCOME="parked"
        fi

        {
          echo "outcome=${OUTCOME}"
          echo "passes=${PASSES}"
          echo "parked-locales=${PARKED}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## kapi up report"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Outcome | **${OUTCOME}** |"
          echo "| Passes | ${PASSES} |"
          echo "| Parked locales | ${PARKED:-—} |"
        } >> "$GITHUB_STEP_SUMMARY"

        echo "Run ${OUTCOME} after ${PASSES} pass(es)."
        if [ "$OUTCOME" = "parked" ]; then
          # Parked is pending work, not a broken run: what it caught up is
          # real progress and still reaches has-changes/changed-files.
          echo "::warning::Translations parked${PARKED:+ for: ${PARKED}} — work remains that the loop could not carry to the ship gate."
          if [ "$FAIL_ON_PARKED" = "true" ]; then
            echo "::error::fail-on-parked is set and the run parked"
            exit 1
          fi
        fi

    # The reporting steps below also run after the check step failed with a
    # verdict (a failed gate, or a check that did not run), because reporting
    # that outcome is what they are for. The job still fails: the check step
    # already did, and a later step that succeeds does not undo it. A run that
    # failed any other way reports nothing, so a delivery step is never handed
    # the partial work of a broken `kapi up`.
    - name: Check for changes
      id: check-changes
      if: inputs.plan != 'true'
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        if [ -z "$PATHS" ]; then
          # No paths specified — check the entire working tree. `kapi init`
          # gitignores the .kapi/ state directory, so what shows up here is the
          # localized content the run produced, including brand-new locale files
          # (which a tracked-files-only diff would miss).
          DIRT="$(git status --porcelain)"
        else
          EXISTING=()
          # shellcheck disable=SC2086  # deliberate word-splitting over the path list
          for p in $PATHS; do
            if [ -e "$p" ]; then
              EXISTING+=("$p")
            fi
          done
          if [ ${#EXISTING[@]} -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIRT="$(git status --porcelain -- "${EXISTING[@]}")"
        fi

        if [ -z "$DIRT" ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<KAPI_EOF"
            awk '{ print substr($0, 4) }' <<< "$DIRT"
            echo "KAPI_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Sticky PR comment
      id: pr-comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MODE: ${{ steps.run-kapi.outputs.mode }}
        OUTCOME: ${{ steps.run-kapi.outputs.outcome }}
        PASSES: ${{ steps.run-kapi.outputs.passes }}
        PARKED: ${{ steps.run-kapi.outputs.parked-locales }}
        GATE: ${{ steps.run-kapi.outputs.gate }}
        RESULT: ${{ steps.run-kapi.outputs.result }}
        CAUSE: ${{ steps.run-kapi.outputs.did-not-run-cause }}
        DID_NOT_RUN_SUMMARY: ${{ steps.run-kapi.outputs.did-not-run-summary }}
        PLAN_MISSING: ${{ steps.run-kapi.outputs.plan-missing }}
        PLAN_TM: ${{ steps.run-kapi.outputs.plan-tm-exact }}
        PLAN_AI: ${{ steps.run-kapi.outputs.plan-ai-remaining }}
        PLAN_TOKENS: ${{ steps.run-kapi.outputs.plan-token-estimate }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        MARKER="<!-- kapi-report -->"

        if [ "$MODE" = "plan" ]; then
          TABLE=$(jq -r '.scopes[] | "| \(.locale) | \(.missingTarget) | \(.tmExact) | \(.aiRemaining) | \(.tokenEstimate) |"' "${RUNNER_TEMP}/kapi-plan.json" 2>/dev/null || true)
          BODY="${MARKER}
        ## kapi up — plan

        This change leaves **${PLAN_MISSING:-0} unit(s)** of pending translation work: ${PLAN_TM:-0} recoverable from TM, ${PLAN_AI:-0} for AI (~${PLAN_TOKENS:-0} tokens estimated).

        | Locale | Pending | TM exact | AI remaining | Token estimate |
        |---|---|---|---|---|
        ${TABLE}

        _[Run](${RUN_URL}) · estimate is source-chars/4, no provider calls._"
        elif [ -n "$GATE" ]; then
          if [ "$GATE" = "pass" ]; then
            HEAD="✅ **Gate: pass** — every requested gate passed."
          else
            HEAD="❌ **Gate: unmet** — a content quality gate failed. See the [run log](${RUN_URL}) for the findings."
          fi
          BODY="${MARKER}
        ## kapi check

        ${HEAD}"
        elif [ "$RESULT" = "did_not_run" ]; then
          ICON="⚠️"
          if [ "$CAUSE" = "checker_invalid" ]; then
            ICON="❌"
          fi
          BODY="${MARKER}
        ## kapi check

        ${ICON} **Did not run** (\`${CAUSE}\`): ${DID_NOT_RUN_SUMMARY} See the [run log](${RUN_URL}) for the reasons."
        elif [ -n "$OUTCOME" ]; then
          BODY="${MARKER}
        ## kapi up report

        | | |
        |---|---|
        | Outcome | **${OUTCOME}** |
        | Passes | ${PASSES:-—} |
        | Parked locales | ${PARKED:-—} |

        _[Run](${RUN_URL})_"
        else
          echo "Nothing to report — skipping comment."
          exit 0
        fi

        COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // empty")
        if [ -n "$COMMENT_ID" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
        else
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
        fi
        echo "Report posted to PR #${PR_NUMBER}."

    - name: Set outputs
      id: set-outputs
      shell: bash
      env:
        HAS_CHANGES: ${{ steps.check-changes.outputs.has_changes }}
        RESULT: ${{ steps.run-kapi.outputs.result }}
      run: |
        set -euo pipefail
        if [ "$RESULT" = "failed" ] || [ "$RESULT" = "did_not_run" ]; then
          echo "status=failed" >> "$GITHUB_OUTPUT"
        elif [ "$HAS_CHANGES" = "true" ]; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "status=no-changes" >> "$GITHUB_OUTPUT"
        fi
