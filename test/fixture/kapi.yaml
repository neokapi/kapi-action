version: v1
name: fixture
defaults:
  source_language: en
  target_languages:
    - fr
    - de

# One source file whose French and German targets are deliberately absent, so
# the plan has pending work and the ship gate fails. A collection groups the
# content kapi reads; each entry maps a source path to its target, and {lang}
# fans the target out per language.
collections:
  - name: app
    content:
      - path: "content/en.json"
        target: "content/{lang}.json"
